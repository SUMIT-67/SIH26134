version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: airfare_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: airfare_index
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d airfare_index"]
      interval: 5s
      timeout: 5s
      retries: 5

  cache:
    image: redis:7-alpine
    container_name: airfare_cache
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: airfare_api
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/airfare_index
      - REDIS_URL=redis://cache:6379/0
      - MOCK_MODE=True
      - SCRAPE_INTERVAL_SECONDS=60
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    volumes:
      - ./data:/app/data

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: airfare_frontend
    ports:
      - "3000:80"
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres_data:
